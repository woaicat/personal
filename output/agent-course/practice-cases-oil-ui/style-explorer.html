.cap{display:flex;align-items:center;gap:12px;padding-top:14px}.cap .no{font-family:var(--mono);font-size:13px;color:var(--faint);transition:color .2s}.cap .name{font-size:16px;font-weight:600;line-height:1.4;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cap .strip-mini{margin:0 auto 0 4px;width:40px;flex:none}.cap .no.base{flex:none;white-space:nowrap;font-family:inherit;font-size:12px;font-weight:600;line-height:1.6;padding:0 8px;border-radius:99px;background:var(--well);color:var(--soft)}

.stage.offline .static{display:none}
.slide .static{display:none}.static{position:absolute;left:10px;bottom:10px;z-index:2;font-size:12.5px;line-height:1.4;padding:3px 8px;border-radius:4px;background:#000c;color:#ddd;pointer-events:none}

@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes vt-out{to{opacity:0;transform:scale(.97)}}

/* 并排与单张之间、视口变化用页面过渡：同一方向的画面从卡片放大到单张，其他卡片淡出，侧栏从右侧滑入 */

::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover;object-position:50% 0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both}
::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}
::view-transition-new(info):only-child{animation:info-in var(--glide-d) var(--glide) both}
::view-transition-old(info):only-child{animation:info-out .22s var(--exit) both}
::view-transition-old(bar){display:none}::view-transition-new(bar){animation:none}
/* 视口和缩放只改变形状与位置：外框直接变形，内容不做叠影 */
html[data-vt=reshape]::view-transition-old(*){animation:none;opacity:0}
html[data-vt=reshape]::view-transition-new(*){animation:none}
html[data-vt=reshape]::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both;opacity:1}
html[data-vt=reshape]::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}

on\" href=\"#\" aria-current=\"page\">实战案例\u003c/a>\u003c/nav>\u003c/div>\u003c/header>\n  \u003cmain>\n    \u003csection class=\"intro\">\u003cdiv>\u003cdiv class=\"eyebrow\">AGENT FIELD NOTES / 01\u003c/div>\u003ch1>实战案例\u003c/h1>\u003c/div>\u003cdiv class=\"intro-side\">\u003cp>精选值得反复拆解的 Agent 实践，看看一个方法解决了什么问题，又如何落到真实产品。\u003c/p>\u003c/div>\u003c/section>\n    \u003cdiv class=\"feature-label\">本期推荐\u003c/div>\n    \u003csection class=\"feature\" aria-label=\"本期推荐\">\n      \u003cdiv class=\"art\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 540 426\" preserveAspectRatio=\"xMidYMid slice\">\u003cdefs>\u003cpattern id=\"dots\" width=\"8\" height=\"8\" patternUnits=\"userSpaceOnUse\">\u003ccircle cx=\"1\" cy=\"1\" r=\"1\" fill=\"#98b5ff\" opacity=\".45\"/>\u003c/pattern>\u003c/defs>\u003crect x=\"27\" y=\"77\" width=\"485\" height=\"293\" fill=\"none\" stroke=\"#a6bdff\" opacity=\".8\" stroke-width=\"1.5\"/>\u003cpath d=\"M60 310 H470 M60 220 H470 M60 130 H470\" stroke=\"#9db8ff\" opacity=\".45\"/>\u003cpath d=\"M160 92 V353 M275 92 V353 M390 92 V353\" stroke=\"#9db8ff\" opacity=\".35\"/>\u003ccircle cx=\"158\" cy=\"220\" r=\"77\" fill=\"#dce9de\"/>\u003ccircle cx=\"158\" cy=\"220\" r=\"49\" fill=\"none\" stroke=\"#1236a2\" stroke-width=\"2\"/>\u003ccircle cx=\"158\" cy=\"220\" r=\"19\" fill=\"#ee7655\"/>\u003cpath d=\"M236 220 H289\" stroke=\"#f3f8ec\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/>\u003ccircle cx=\"310\" cy=\"220\" r=\"21\" fill=\"#ee7655\"/>\u003cpath d=\"M330 220 C374 220 360 145 414 145 M330 220 C374 220 360 295 414 295\" fill=\"none\" stroke=\"#f3f8ec\" stroke-width=\"2\"/>\u003crect x=\"408\" y=\"110\" width=\"70\" height=\"70\" fill=\"#dce9de\"/>\u003cpath d=\"M421 159 l13 -14 12 9 18 -24\" fill=\"none\" stroke=\"#1236a2\" stroke-width=\"3\"/>\u003crect x=\"408\" y=\"260\" width=\"70\" height=\"70\" fill=\"#dce9de\"/>\u003cpath d=\"M421 282 h44 M421 295 h36 M421 308 h22\" stroke=\"#1236a2\" stroke-width=\"3\"/>\u003crect x=\"72\" y=\"104\" width=\"120\" height=\"20\" fill=\"url(#dots)\"/>\u003cpath d=\"M76 335 h160 M298 335 h92\" stroke=\"#f3f8ec\" stroke-width=\"1\"/>\u003ccircle cx=\"80\" cy=\"335\" r=\"5\" fill=\"#ee7655\"/>\u003c/svg>\u003c/div>\n      \u003cdiv class=\"feature-copy\">\u003cdiv class=\"issue\">\u003cb>\u003c/b>编辑精选 · Agent 评测\u003c/div>\u003ch2>让 Agent 评测，\u003cbr>走出漂亮的演示\u003c/h2>\u003cp>真正可靠的 Agent，不只是在标准问题里回答正确。这篇内容从真实任务、失败样本和人工复核出发，梳理可持续迭代的评测闭环，适合准备把 Agent 推向真实业务的团队。\u003c/p>\u003cdiv class=\"meta-row\">\u003cdiv class=\"source\">OpenAI \u003cspan>·\u003c/span> 文章 \u003cspan>·\u003c/span> 深度阅读\u003c/div>\u003cbutton class=\"read\" type=\"button\">查看推荐内容&nbsp; →\u003c/button>\u003c/div>\u003c/div>\n    \u003c/section>\n    \u003csection class=\"catalog\" aria-labelledby=\"catalog-title\">\u003cdiv class=\"catalog-head\">\u003cdiv class=\"catalog-title\">\u003ch2 id=\"catalog-title\">按主题探索\u003c/h2>\u003c/div>\u003cdiv class=\"count\">04 篇案例\u003c/div>\u003c/div>\u003cdiv class=\"topics\" aria-label=\"按主题筛选\">\u003cbutton class=\"active\">全部案例\u003c/button>\u003cbutton>Agent 评测\u003c/button>\u003cbutton>成本优化\u003c/button>\u003cbutton>安全控制\u003c/button>\u003cbutton>用户体验\u003c/button>\u003cbutton>工作流设计\u003c/button>\u003c/div>\n      \u003cdiv class=\"case-grid\">\n        \u003carticle class=\"case\">\u003cdiv class=\"case-art\">\u003csvg viewBox=\"0 15 160 120\" preserveAspectRatio=\"xMidYMid meet\" aria-hidden=\"true\">\u003crect x=\"13\" y=\"22\" width=\"134\" height=\"108\" fill=\"none\" stroke=\"#9eb6ff\" stroke-width=\"1.2\"/>\u003cpath d=\"M24 107h111M24 76h111M47 30v91M91 30v91\" stroke=\"#9eb6ff\" opacity=\".38\"/>\u003ccircle cx=\"47\" cy=\"75\" r=\"27\" fill=\"#dce9de\"/>\u003ccircle cx=\"47\" cy=\"75\" r=\"17\" fill=\"none\" stroke=\"#1236a2\" stroke-width=\"1.5\"/>\u003ccircle cx=\"47\" cy=\"75\" r=\"7\" fill=\"#ee7655\"/>\u003cpath d=\"M74 75h25\" stroke=\"#f5faf1\" stroke-width=\"1.7\" stroke-dasharray=\"4 3\"/>\u003ccircle cx=\"100\" cy=\"75\" r=\"7\" fill=\"#ee7655\"/>\u003cpath d=\"M107 75c12 0 8-20 19-20m-19 20c12 0 8 20 19 20\" fill=\"none\" stroke=\"#f5faf1\" stroke-width=\"1.6\"/>\u003crect x=\"121\" y=\"45\" width=\"17\" height=\"17\" fill=\"#dce9de\"/>\u003cpath d=\"m125 54 4 4 6-9\" fill=\"none\" stroke=\"#1236a2\" stroke-width=\"1.6\"/>\u003crect x=\"121\" y=\"88\" width=\"17\" height=\"17\" fill=\"#dce9de\"/>\u003cpath d=\"M125 94h9m-9 5h6\" stroke=\"#1236a2\" stroke-width=\"1.3\"/>\u003ccircle cx=\"24\" cy=\"116\" r=\"2.3\" fill=\"#ee7655\"/>\u003cpath d=\"M30 116h36m10 0h17\" stroke=\"#dce9ff\" stroke-width=\"1\"/>\u003c/svg>\u003c/div>\u003cdiv>\u003cdiv class=\"case-kicker\">AGENT 评测\u003c/div>\u003ch3>如何建立 Agent 的评测体系\u003c/h3>\u003cp>从“看起来能用”走向“知道何时可用”。围绕目标设定、任务样本、指标和人工复核，拆解一套能在产品迭代中持续运行的评测方法，并记录每次模型更新后表现改善与退步的具体场景。\u003c/p>\u003cdiv class=\"case-foot\">OpenAI \u003ci>\u003c/i> 文章 \u003cb>↗\u003c/b>\u003c/div>\u003c/div>\u003c/article>\n        \u003carticle class=\"case\">\u003cdiv class=\"case-art\">\u003csvg viewBox=\"0 15 160 120\" preserveAspectRatio=\"xMidYMid meet\" aria-hidden=\"true\">\u003crect x=\"13\" y=\"22\" width=\"134\" height=\"108\" fill=\"none\" stroke=\"#9eb6ff\" stroke-width=\"1.2\"/>\u003cpath d=\"M24 44h110M24 76h110M24 108h110M64 31v91M114 31v91\" stroke=\"#9eb6ff\" opacity=\".36\"/>\u003ccircle cx=\"38\" cy=\"75\" r=\"16\" fill=\"#dce9de\"/>\u003cpath d=\"M30 75h16m-8-8v16\" stroke=\"#1236a2\" stroke-width=\"1.7\"/>\u003cpath d=\"M54 75h30c12 0 9-22 21-22m-21 22c12 0 9 22 21 22\" fill=\"none\" stroke=\"#f5faf1\" stroke-width=\"1.6\"/>\u003ccircle cx=\"85\" cy=\"75\" r=\"6\" fill=\"#ee7655\"/>\u003crect x=\"103\" y=\"42\" width=\"27\" height=\"23\" fill=\"#dce9de\"/>\u003cpath d=\"M109 57h15m-15-7h11\" stroke=\"#1236a2\" stroke-width=\"1.4\"/>\u003crect x=\"103\" y=\"85\" width=\"27\" height=\"23\" fill=\"#dce9de\"/>\u003cpath d=\"M109 100h15m-15-7h11\" stroke=\"#1236a2\" stroke-width=\"1.4\"/>\u003cpath d=\"M29 117h35m13 0h48\" stroke=\"#dce9ff\" stroke-width=\"1\"/>\u003ccircle cx=\"71\" cy=\"117\" r=\"2.4\" fill=\"#ee7655\"/>\u003c/svg>\u003c/div>\u003cdiv>\u003cdiv class=\"case-kicker\">成本优化\u003c/div>\u003ch3>把每一次模型调用都算清楚\u003c/h3>\u003cp>Agent 的成本不只取决于模型单价。内容从任务拆分、上下文长度、缓存与路由策略入手，帮助团队定位真正昂贵的步骤，再比较修改流程和降低模型规格各自能带来的收益。\u003c/p>\u003cdiv class=\"case-foot\">YouTube \u003ci>\u003c/i> 视频 \u003cb>↗\u003c/b>\u003c/div>\u003c/div>\u003c/article>\n        \u003carticle class=\"case\">\u003cdiv class=\"case-art\">\u003csvg viewBox=\"0 15 160 120\" preserveAspectRatio=\"xMidYMid meet\" aria-hidden=\"true\">\u003crect x=\"13\" y=\"22\" width=\"134\" height=\"108\" fill=\"none\" stroke=\"#9eb6ff\" stroke-width=\"1.2\"/>\u003cpath d=\"M24 46h112M24 106h112M49 30v91M108 30v91\" stroke=\"#9eb6ff\" opacity=\".35\"/>\u003cpath d=\"M33 76h35\" stroke=\"#f5faf1\" stroke-width=\"1.7\" stroke-dasharray=\"4 3\"/>\u003ccircle cx=\"33\" cy=\"76\" r=\"7\" fill=\"#ee7655\"/>\u003crect x=\"67\" y=\"43\" width=\"43\" height=\"66\" fill=\"#dce9de\"/>\u003cpath d=\"M88 54l13 5v13c0 12-5 19-13 24-8-5-13-12-13-24V59l13-5z\" fill=\"none\" stroke=\"#1236a2\" stroke-width=\"1.8\"/>\u003cpath d=\"m81 75 5 5 9-12\" fill=\"none\" stroke=\"#ee7655\" stroke-width=\"2.8\"/>\u003cpath d=\"M110 76h27\" stroke=\"#f5faf1\" stroke-width=\"1.7\"/>\u003ccircle cx=\"135\" cy=\"76\" r=\"5\" fill=\"#ee7655\"/>\u003cpath d=\"M28 117h44m10 0h47\" stroke=\"#dce9ff\" stroke-width=\"1\"/>\u003ccircle cx=\"77\" cy=\"117\" r=\"2.4\" fill=\"#ee7655\"/>\u003c/svg>\u003c/div>\u003cdiv>\u003cdiv class=\"case-kicker\">安全控制\u003c/div>\u003ch3>给自主执行设置清晰边界\u003c/h3>\u003cp>当 Agent 可以调用工具和更改外部状态，风险会从回答错误扩大到真实操作。案例集中讨论权限分层、确认时机和异常回退的设计取舍，并说明哪些高风险动作应当在执行前交回给用户。\u003c/p>\u003cdiv class=\"case-foot\">Anthropic \u003ci>\u003c/i> 指南 \u003cb>↗\u003c/b>\u003c/div>\u003c/div>\u003c/article>\n        \u003carticle class=\"case\">\u003cdiv class=\"case-art\">\u003csvg viewBox=\"0 15 160 120\" preserveAspectRatio=\"xMidYMid meet\" aria-hidden=\"true\">\u003crect x=\"13\" y=\"22\" width=\"134\" height=\"108\" fill=\"none\" stroke=\"#9eb6ff\" stroke-width=\"1.2\"/>\u003cpath d=\"M24 43h112M24 105h112M52 30v91M104 30v91\" stroke=\"#9eb6ff\" opacity=\".35\"/>\u003cpath d=\"M34 100V79c0-21 23-35 43-35s44 14 44 35v21\" fill=\"none\" stroke=\"#f5faf1\" stroke-width=\"1.6\"/>\u003ccircle cx=\"34\" cy=\"99\" r=\"7\" fill=\"#ee7655\"/>\u003ccircle cx=\"77\" cy=\"45\" r=\"8\" fill=\"#ee7655\"/>\u003ccircle cx=\"121\" cy=\"99\" r=\"7\" fill=\"#ee7655\"/>\u003crect x=\"47\" y=\"66\" width=\"61\" height=\"33\" fill=\"#dce9de\"/>\u003cpath d=\"M55 77h44M55 86h29\" stroke=\"#1236a2\" stroke-width=\"1.8\"/>\u003cpath d=\"M29 116h43m12 0h44\" stroke=\"#dce9ff\" stroke-width=\"1\"/>\u003ccircle cx=\"78\" cy=\"116\" r=\"2.4\" fill=\"#ee7655\"/>\u003c/svg>\u003c/div>\u003cdiv>\u003cdiv class=\"case-kicker\">用户体验\u003c/div>\u003ch3>让用户看得懂 Agent 正在做什么\u003c/h3>\u003cp>把规划、执行和等待状态翻译成用户能理解的反馈。借助进度说明、可中断操作和结果依据，减少黑箱感，让用户知道何时可以放心等待、何时需要参与判断，并逐渐建立使用信任。\u003c/p>\u003cdiv class=\"case-foot\">产品设计笔记 \u003ci>\u003c/i> 文章 \u003cb>↗\u003c/b>\u003c/div>\u003c/div>\u003c/article>\n      \u003c/div>\n    \u003c/section>\n  \u003c/main>\u003cdiv class=\"bottom-rule\">\u003c/div>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "01-research-journal.html", "baseline": false, "interactive": false}, {"id": "studio-bulletin", "name": "实践公告", "concept": "像一份有鲜明编辑判断的实践刊物；推荐内容先声夺人，目录保留深入阅读空间。", "typography": "重磅中文无衬线标题 82/39px，正文 16–17px，英文刊物索引 12–13px", "palette": ["#f3f5ef", "#182b37", "#2c5fe6", "#d9ee82"], "traits": ["深色推荐海报与层叠流程插图", "大幅统一图符引导横向案例列表", "高对比粗线与方角形成控件语法"], "kind": "html", "content": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'\">\n  \u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003clink rel=\"icon\" href=\"da class=\"top-inner\">\u003ca class=\"brand\" href=\"#\">jiaxuan \u003ci>·\u003c/i> 从 0 到 1\u003c/a>\u003cnav class=\"nav\" aria-label=\"课程导航\">\u003ca href=\"#\">Agent\u003c/a>\u003ca class=\"on\" href=\"#\" aria-current=\"page\">实战案例\u003c/a>\u003c/nav>\u003c/div>\u003c/header>\n  \u003cmain>\n    \u003cheader class=\"page-head\">\u003cdiv>\u003cdiv class=\"small\">THE PRACTICE INDEX / 001\u003c/div>\u003ch1>实战案例\u003cspan style=\"color:var(--blue)\">.\u003c/span>\u003c/h1>\u003c/div>\u003cp>\u003cstrong>把好内容留下来，把经验拆开来看。\u003c/strong>\u003cbr>从评测到体验，持续收录 Agent 产品设计与开发中的具体做法。\u003c/p>\u003c/header>\n    \u003csection class=\"feature\" aria-label=\"本期推荐\">\u003cdiv class=\"feature-copy\">\u003cdiv class=\"issue\">\u003cb>本期推荐\u003c/b>\u003cspan>EDITOR'S PICK / 01\u003c/span>\u003c/div>\u003ch2>好用的 Agent，\u003cbr>先要让人知道\u003cbr>它正在做什么\u003c/h2>\u003cp>当 Agent 不再只是回答问题，用户需要理解它准备做什么、已经做了什么，以及哪里仍需要自己确认。这篇内容把透明反馈、人工介入和结果解释放在同一条体验路径上，很适合拿来审视产品中的关键交互。\u003c/p>\u003cdiv class=\"feature-bottom\">\u003cbutton class=\"feature-action\" type=\"button\">查看本期内容&nbsp; ↗\u003c/button>\u003cdiv class=\"feature-source\">产品设计研究 · 文章 · 用户体验\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"feature-art\" aria-hidden=\"true\">\u003cdiv class=\"feature-side\">ONE IDEA, MANY DECISIONS\u003c/div>\u003csvg viewBox=\"0 0 480 430\" preserveAspectRatio=\"xMidYMid meet\">\u003cg transform=\"translate(32 43) rotate(-7 202 180)\">\u003crect x=\"57\" y=\"10\" width=\"312\" height=\"336\" fill=\"#f7eecb\" stroke=\"#142b37\" stroke-width=\"4\"/>\u003crect x=\"80\" y=\"36\" width=\"312\" height=\"336\" fill=\"#d9ee82\" stroke=\"#142b37\" stroke-width=\"4\"/>\u003crect x=\"104\" y=\"60\" width=\"312\" height=\"336\" fill=\"#cfe6dc\" stroke=\"#142b37\" stroke-width=\"4\"/>\u003cpath d=\"M126 115H392 M126 335H392\" stroke=\"#142b37\" stroke-width=\"3\"/>\u003ctext x=\"131\" y=\"101\" font-family=\"Arial\" font-size=\"18\" font-weight=\"800\" fill=\"#142b37\">AGENT / PROCESS\u003c/text>\u003ccircle cx=\"171\" cy=\"216\" r=\"44\" fill=\"#f28162\" stroke=\"#142b37\" stroke-width=\"4\"/>\u003ccircle cx=\"171\" cy=\"216\" r=\"17\" fill=\"#142b37\"/>\u003cpath d=\"M214 216H263\" stroke=\"#142b37\" stroke-width=\"4\"/>\u003cpath d=\"m253 206 12 10-12 10\" fill=\"none\" stroke=\"#142b37\" stroke-width=\"4\"/>\u003crect x=\"273\" y=\"176\" width=\"84\" height=\"79\" fill=\"#d9ee82\" stroke=\"#142b37\" stroke-width=\"4\"/>\u003cpath d=\"M290 207h50m-50 16h33\" stroke=\"#142b37\" stroke-width=\"4\"/>\u003ccircle cx=\"353\" cy=\"306\" r=\"29\" fill=\"#f28162\" stroke=\"#142b37\" stroke-width=\"4\"/>\u003cpath d=\"m340 306 9 9 15-19\" fill=\"none\" stroke=\"#142b37\" stroke-width=\"4\"/>\u003ctext x=\"130\" y=\"365\" font-family=\"Arial\" font-size=\"15\" font-weight=\"800\" fill=\"#142b37\">OBSERVE — EXPLAIN — CONFIRM\u003c/text>\u003c/g>\u003c/svg>\u003c/div>\u003c/section>\n    \u003csection class=\"library\" aria-labelledby=\"library-title\">\u003cdiv class=\"section-top\">\u003cdiv>\u003cdiv class=\"small\">BROWSE THE COLLECTION\u003c/div>\u003ch2 id=\"library-title\">案例目录\u003c/h2>\u003c/div>\u003cp>按你遇到的问题开始阅读 · 共 04 篇\u003c/p>\u003c/div>\u003cdiv class=\"filters\" aria-label=\"案例标签\">\u003cbutton class=\"active\">全部\u003c/button>\u003cbutton>Agent 评测\u003c/button>\u003cbutton>成本优化\u003c/button>\u003cbutton>安全控制\u003c/button>\u003cbutton>用户体验\u003c/button>\u003cbutton>工作流设计\u003c/button>\u003c/div>\n      \u003carticle class=\"case\">\u003cdiv class=\"case-art\">\u003csvg viewBox=\"0 0 140 130\">\u003crect x=\"10\" y=\"18\" width=\"117\" height=\"95\" fill=\"#d9ee82\" stroke=\"#1b3546\" stroke-width=\"3\"/>\u003cpath d=\"M27 39h83M27 89h83\" stroke=\"#1b3546\" stroke-width=\"3\"/>\u003ccircle cx=\"52\" cy=\"64\" r=\"17\" fill=\"#f28162\" stroke=\"#1b3546\" stroke-width=\"3\"/>\u003ccircle cx=\"98\" cy=\"64\" r=\"17\" fill=\"#f8f6e7\" stroke=\"#1b3546\" stroke-width=\"3\"/>\u003cpath d=\"M69 64h12\" stroke=\"#1b3546\" stroke-width=\"3\"/>\u003c/svg>\u003c/div>\u003cdiv>\u003cdiv class=\"case-num\">CASE 01 / EVALUATION\u003c/div>\u003ch3>如何建立 Agent 的评测体系\u003c/h3>\u003cp>别让一次漂亮的 Demo 代替产品判断。这份实践从任务分层、数据集搭建、失败样本与人工复核切入，讨论如何把评测嵌入开发节奏，让每次模型或提示词更新都有可追踪的依据。\u003c/p>\u003c/div>\u003cdiv class=\"case-tail\">\u003cspan class=\"tag\">Agent 评测\u003c/span>\u003cspan>OpenAI · 文章\u003c/span>\u003ca href=\"#\">阅读案例 ↗\u003c/a>\u003c/div>\u003c/article>\n      \u003carticle class=\"case\">\u003cdiv class=\"case-art lime\">\u003csvg viewBox=\"0 0 140 130\">\u003crect x=\"13\" y=\"18\" width=\"114\" height=\"94\" fill=\"#f6f7e9\" stroke=\"#1b3546\" stroke-width=\"3\"/>\u003cpath d=\"M27 91h84M35 91V69h18v22m9 0V51h18v40m9 0V34h18v57\" fill=\"#cfe6dc\" stroke=\"#1b3546\" stroke-width=\"3\"/>\u003ccircle cx=\"26\" cy=\"38\" r=\"12\" fill=\"#f28162\" stroke=\"#1b3546\" stroke-width=\"3\"/>\u003c/svg>\u003c/div>\u003cdiv>\u003cdiv class=\"case-num\">CASE 02 / COST\u003c/div>\u003ch3>把 Agent 的成本花在关键步骤上\u003c/h3>\u003cp>成本优化往往不是简单地更换便宜模型。先看清哪些任务真正需要推理、哪些上下文被重复发送，再比较缓存、模型路由和流程改写的收益。这篇内容提供了可操作的排查顺序。\u003c/p>\u003c/div>\u003cdiv class=\"case-tail\">\u003cspan class=\"tag\">成本优化\u003c/span>\u003cspan>YouTube · 视频\u003c/span>\u003ca href=\"#\">观看案例 ↗\u003c/a>\u003c/div>\u003c/article>\n      \u003carticle class=\"case\">\u003cdiv class=\"case-art orange\">\u003csvg viewBox=\"0 0 140 130\">\u003cpath d=\"M70 10 121 31v37c0 27-21 43-51 55C40 111 19 95 19 68V31L70 10Z\" fill=\"#d9ee82\" stroke=\"#1b3546\" stroke-width=\"4\"/>\u003crect x=\"45\" y=\"52\" width=\"50\" height=\"43\" fill=\"#f8f6e7\" stroke=\"#1b3546\" stroke-width=\"3\"/>\u003cpath d=\"M55 52V40a15 15 0 0 1 30 0v12\" fill=\"none\" stroke=\"#1b3546\" stroke-width=\"3\"/>\u003ccircle cx=\"70\" cy=\"73\" r=\"6\" fill=\"#f28162\"/>\u003c/svg>\u003c/div>\u003cdiv>\u003cdiv class=\"case-num\">CASE 03 / SAFETY\u003c/div>\u003ch3>为可执行的 Agent 画一条安全线\u003c/h3>\u003cp>当 Agent 获得工具权限，错误不再停留在对话框里。文章沿着授权、执行、确认和回滚四个节点，拆解哪些决策可以自动完成，哪些动作必须留给用户，以及异常时如何收回控制权。\u003c/p>\u003c/div>\u003cdiv class=\"case-tail\">\u003cspan class=\"tag\">安全控制\u003c/span>\u003cspan>Anthropic · 指南\u003c/span>\u003ca href=\"#\">阅读案例 ↗\u003c/a>\u003c/div>\u003c/article>\n      \u003carticle class=\"case\">\u003cdiv class=\"case-art\">\u003csvg viewBox=\"0 0 140 130\">\u003crect x=\"11\" y=\"17\" width=\"118\" height=\"96\" fill=\"#f6f7e9\" stroke=\"#1b3546\" stroke-width=\"3\"/>\u003cpath d=\"M11 41h118\" stroke=\"#1b3546\" stroke-width=\"3\"/>\u003crect x=\"26\" y=\"54\" width=\"50\" height=\"43\" fill=\"#d9ee82\" stroke=\"#1b3546\" stroke-width=\"3\"/>\u003cpath d=\"M88 57h27m-27 15h27m-27 15h20\" stroke=\"#1b3546\" stroke-width=\"3\"/>\u003ccircle cx=\"43\" cy=\"75\" r=\"10\" fill=\"#f28162\" stroke=\"#1b3546\" stroke-width=\"3\"/>\u003c/svg>\u003c/div>\u003cdiv>\u003cdiv class=\"case-num\">CASE 04 / EXPERIENCE\u003c/div>\u003ch3>把过程透明度做成产品能力\u003c/h3>\u003cp>用户并不需要看见每一行工具日志，却需要知道任务走到哪一步，以及当前状态意味着什么。这个案例把计划预览、阶段反馈和结果解释连成一条路径，帮助设计可预测、可纠正的交互。\u003c/p>\u003c/div>\u003cdiv class=\"case-tail\">\u003cspan class=\"tag\">用户体验\u003c/span>\u003cspan>设计实践 · 文章\u003c/span>\u003ca href=\"#\">阅读案例 ↗\u003c/a>\u003c/div>\u003c/article>\n    \u003c/section>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "02-studio-bulletin.html", "baseline": false, "interactive": false}], "fingerprint": "32aa3b60716ab75d414b49b8", "edition": "open"};

 const ease=n=>getComputedStyle(root).getPropertyValue(`--${n}`).trim()||'ease-out';
 let st={layout:'compare',viewport:'desktop',current:C[0].id,chosen:null},stored=true,zoomActual=false,compareScroll=0,gridKey='',loupeKey='',toastTimer=0;
 try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&typeof saved==='object'){for(const key of Object.keys(st))if(key in saved)st[key]=saved[key];if(!byId[st.chosen])st.chosen=null;if(!byId[st.current])st.current=C[0].id;if(!['compare','loupe'].includes(st.layout))st.layout='compare';if(!SIZES[st.viewport])st.viewport='desktop';}}catch{stored=false;}
 function save(){if(!stored)return;try{localStorage.setItem(KEY,JSON.stringify(st));}catch{stored=false;}}
 const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;};
 const shown=()=>C;
 const services=new Map(C.filter(c=>c.kind==='url').map(c=>[c.content,{ready:null,pending:false}]));
 const startCommand=DATA.serve?(DATA.serve.cwd?`cd "${DATA.serve.cwd.replace(/[\\"$`]/g,'\\$&')}" && ${DATA.serve.command}`:DATA.serve.command):'';

 function serviceNotice(){
  const note=el('div','service-note'),message=el('div','service-message');note.hidden=true;note.setAttribute('role','status');
  message.append(el('h3',null,t('serviceUnavailable')),el('p',null,t('serviceHelp')));
  if(startCommand){const row=el('div','service-command'),button=el('button','tool',t('copyCommand'));button.type='button';button.dataset.copyServe='';button.setAttribute('aria-label',t('copyCommandLabel'));button.addEventListener('click',()=>copy(startCommand));row.append(el('code',null,startCommand),button);message.append(row);}
  note.append(message);return note;
 }
 function syncService(s,c){
  const ready=services.get(c.content).ready,m=s.querySelector('iframe');
  s.classList.toggle('offline',ready===false);s.querySelector('.service-note').hidden=ready!==false;m.hidden=ready!==true;
  if(ready===true){if(m.getAttribute('src')!==c.content){s.classList.remove('ready');m.src=c.content;}}
  else{s.classList.remove('ready');if(m.hasAttribute('src'))m.removeAttribute('src');}
 }
 async function checkService(url){
  const state=services.get(url);if(state.pending)return;state.pending=true;
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),2500);
  const target=new URL(url);if(target.hostname==='[::1]')target.hostname='localhost';
  try{await fetch(target.href,{mode:'no-cors',cache:'no-store',credentials:'omit',signal:controller.signal});state.ready=true;}catch{state.ready=false;}
  finally{clearTimeout(timer);state.pending=false;}
  $$('.stage').forEach(s=>{const c=byId[s.dataset.id];if(c.kind==='url'&&c.content===url)syncService(s,c);});
 }
 const checkServices=()=>services.forEach((state,url)=>checkService(url));

 // 动效工具：尊重“减少动态效果”，浏览器不支持时直接落到最终状态
 function animate(node,frames,opts){if(calm.matches||!node?.animate)return;try{node.animate(frames,opts);}catch{node.animate(frames,{...opts,easing:'ease-out'});}}
 let vtSeq=0;
 function morph(update,kind){
  if(calm.matches||!document.startViewTransition||document.hidden){update();return;}
  const n=++vtSeq;root.dataset.vt=kind||'';
  try{document.startViewTransition(update).finished.finally(()=>{if(n===vtSeq)delete root.dataset.vt;});}catch{update();}
 }
 function slideTo(ind,target,instant){
  if(!ind||!target||!target.offsetWidth)return;
  if(instant)ind.style.transition='none';
  ind.style.width=`${target.offsetWidth}px`;ind.style.height=`${target.offsetHeight}px`;ind.style.transform=`translate(${target.offsetLeft}px,${target.offsetTop}px)`;
  if(instant){ind.offsetWidth;ind.style.transition='';}
 }
 const placeThumbs=instant=>$$('.seg').forEach(s=>slideTo(s.querySelector('.thumb'),s.querySelector('[aria-pressed=true]'),instant));
 const placeFilm=instant=>{const f=$('#film');slideTo(f.querySelector('.film-ind'),f.querySelector('[aria-current=true]'),instant);};

 $('#project').textContent=DATA.project;
 $('#brief').textContent=DATA.brief||'';

 function stripMini(c){const s=el('span','strip-mini');(c.palette||[]).forEach(h=>{const i=el('i');i.style.background=h;s.append(i);});return s;}
 function stage(c,interactive){
  const s=el('div','stage');s.dataset.id=c.id;
  const m=document.createElement(c.kind==='image'?'img':'iframe');
  if(c.kind==='image'){m.alt=c.name;m.draggable=false;}
  else{m.title=c.name;m.setAttribute('sandbox',c.kind==='url'?'allow-scripts allow-same-origin allow-forms':c.interactive?'allow-scripts allow-forms':'');m.referrerPolicy='no-referrer';if(!interactive)m.tabIndex=-1;}
  m.addEventListener('load',()=>{if(c.kind==='url'&&services.get(c.content).ready!==true)return;s.classList.add('ready');fit(s);});
  if(c.kind==='image')m.src=c.content;else if(c.kind!=='url')m.srcdoc=c.content;
  s.append(m);
  if(c.kind==='url'){s.append(serviceNotice());syncService(s,c);}
  if(c.kind!=='html'||c.interactive)s.append(el('span','static',c.kind==='url'?t('live'):c.kind==='image'?t('image'):t('interactive')));
  return s;
 }
 function fit(s){
  if(!s.isConnected)return;
  const size=SIZES[st.viewport],m=s.querySelector('iframe,img'),box=s.parentElement;let r;
  if(box.classList.contains('slide')){const cs=getComputedStyle(box),w=box.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),h=narrow()?Infinity:box.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);r=box.dataset.zoom==='actual'?1:Math.min(w/size.w,h/size.h,1);}
  else r=Math.min(box.clientWidth/size.w,1);
  if(!(r>0))return;
  s.style.width=`${size.w*r}px`;s.style.height=`${size.h*r}px`;m.style.width=`${size.w}px`;m.style.height=`${size.h}px`;m.style.transform=`scale(${r})`;
 }
 const fitAll=()=>$$('.stage').forEach(fit),refit=()=>requestAnimationFrame(fitAll);

 function specList(c){
  const dl=el('dl','spec');const row=(k,v)=>{dl.append(el('dt',null,k),el('dd',null,v));};
  row(t('fonts'),c.typography);row(t('traits'),(c.traits||[]).join(' · '));return dl;
 }
 function pickButton(c){const b=el('button','pick');b.type='button';b.dataset.pick=c.id;b.addEventListener('click',()=>choose(c.id));return b;}
 function card(c,i){
  const a=el('article','card');a.dataset.id=c.id;a.style.setProperty('--i',i);a.setAttribute('aria-label',c.name);
  const frame=el('div','frame');frame.style.viewTransitionName=vtName(c);const s=stage(c,false);
  const hit=el('button','hit');hit.type='button';hit.setAttribute('aria-label',t('viewDirection',{name:c.name}));hit.addEventListener('click',()=>setLayout('loupe',c.id));
  s.append(hit);frame.append(s,el('span','pick-mark',t('selected')),el('span','peek',t('peek')));
  const cap=el('div','cap');cap.style.viewTransitionName=`cap-${C.indexOf(c)}`;cap.append(el('span',c.baseline?'no base':'no',no(c)),el('h2','name',c.name),stripMini(c),pickButton(c));
  const lede=el('p','lede',c.concept);lede.title=c.concept;lede.style.viewTransitionName=`lede-${C.indexOf(c)}`;
  a.append(frame,cap,lede);return a;
 }
 function syncCompare(){
  const list=shown(),g=$('#grid'),key=list.map(c=>c.id).join();
  if(key!==gridKey){gridKey=key;g.replaceChildren(...list.map(card));}
  g.style.setProperty('--cols',Math.min(Math.max(list.length,1),st.viewport==='mobile'?4:3));
  $$('.card .frame').forEach(f=>f.dataset.viewport=st.viewport);
 }

 // 单张查看：所有方向预先排成一条横向轨道，切换时整条轨道滑动，不重新加载画面
 function syncLoupe(dir){
  const list=shown(),key=list.map(c=>c.id).join();if(!list.length)return;
  if(key!==loupeKey){
   loupeKey=key;dir=0;
   $('#track').replaceChildren(...list.map(c=>{const sl=el('div','slide');sl.dataset.id=c.id;sl.append(stage(c,true));return sl;}));
   $('#film').replaceChildren(el('span','film-ind'),...list.map(c=>{const b=el('button');b.type='button';b.dataset.id=c.id;b.append(el('span','fn',no(c)),el('span','ft',c.name),stripMini(c));b.addEventListener('click',()=>go(c.id));return b;}));
  }
  if(!list.some(c=>c.id===st.current))st.current=list[0].id;
  const i=list.findIndex(c=>c.id===st.current),track=$('#track');
  if(!dir)track.style.transition='none';
  track.style.transform=`translateX(${-i*100}%)`;
  if(!dir){track.offsetWidth;track.style.transition='';}
  $$('.slide').forEach(sl=>{const on=sl.dataset.id===st.current;sl.classList.toggle('is-current',on);sl.inert=!on;sl.dataset.zoom=on&&zoomActual?'actual':'fit';sl.firstElementChild.style.viewTransitionName=on?vtName(byId[sl.dataset.id]):'none';});
  $('#prev').disabled=i<=0;$('#next').disabled=i>=list.length-1;
  $$('#film button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===st.current)));
  renderInfo(dir);placeFilm(!dir);
  const cur=$('#film [aria-current=true]'),f=$('#film');
  if(cur&&f.scrollWidth>f.clientWidth)f.scrollTo({left:cur.offsetLeft-16,behavior:calm.matches||!dir?'auto':'smooth'});
 }
 function renderInfo(dir){
  const c=byId[st.current],body=$('#info-body');
  const sw=el('div','big-sw');(c.palette||[]).forEach(h=>{const d=el('div');const x=el('i');x.style.background=h;d.append(x,h.toUpperCase());sw.append(d);});
  const tools=el('div','tools');const z=el('button','tool',zoomActual?t('fit'):t('actual'));z.id='zoom';z.type='button';z.setAttribute('aria-pressed',String(zoomActual));z.addEventListener('click',toggleZoom);tools.append(z);
  const hint=el('p','hint');hint.innerHTML=t('keyboardHint');
  const blocks=[el('span','idx',no(c)),el('h2','name',c.name)];
  blocks.push(el('p','north',c.concept),sw,specList(c));
  blocks.push(pickButton(c),tools,hint);
  body.replaceChildren(...blocks);paintChoice();
  if(dir)animate(body,[{opacity:0,transform:`translateX(${dir*18}px)`},{opacity:1,transform:'none'}],{duration:420,easing:ease('glide')});
 }
 function toggleZoom(){
  morph(()=>{zoomActual=!zoomActual;const sl=$('.slide.is-current');sl.dataset.zoom=zoomActual?'actual':'fit';fitAll();sl.scrollTo(0,0);const z=$('#zoom');z.textContent=zoomActual?t('fit'):t('actual');z.setAttribute('aria-pressed',String(zoomActual));},'reshape');
 }

 function render(){
  const list=shown(),loupe=st.layout==='loupe'&&list.length>0;
  $('#compare-view').hidden=st.layout!=='compare'||!list.length;$('#loupe').hidden=!loupe;
  syncCompare();syncLoupe(0);
  $$('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===st.layout)));
  $$('[data-viewport]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.viewport===st.viewport)));
  placeThumbs(false);placeFilm(true);
  paintChoice();fitAll();
 }
 function setLayout(layout,id){
  if(layout===st.layout&&!(id&&id!==st.current))return;
  if(layout==='loupe'&&st.layout==='compare')compareScroll=scrollY;
  if(id)st.current=id;st.layout=layout;zoomActual=false;save();
  morph(()=>{
   render();
   if(layout==='loupe'){window.scrollTo(0,0);return;}
   window.scrollTo(0,compareScroll);
   const a=$(`.card[data-id="${CSS.escape(st.current)}"]`),r=a?.getBoundingClientRect();
   if(r&&(r.top<60||r.bottom>innerHeight))a.scrollIntoView({block:'center'});
  });
 }
 function go(id){
  const list=shown(),from=list.findIndex(c=>c.id===st.current),to=list.findIndex(c=>c.id===id);
  if(to<0||to===from)return;
  st.current=id;zoomActual=false;save();syncLoupe(Math.sign(to-from));fitAll();
 }
 function step(d){const list=shown(),i=list.findIndex(c=>c.id===st.current),n=list[i+d];if(n)go(n.id);else nudge(d);}
 function nudge(d){animate($('.slide.is-current .stage'),[{transform:'none'},{transform:`translateX(${d*14}px)`},{transform:'none'}],{duration:320,easing:'ease-out'});}

 // 选择即复制：再次点击“已选择”重新复制这个方向
 function choose(id){
  const fresh=st.chosen!==id;st.chosen=id;save();paintChoice();
  if(fresh){
   animate($(`.card[data-id="${CSS.escape(id)}"] .pick-mark`),[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],{duration:500,easing:ease('pop')});
  }
  copy();
 }
 function paintChoice(){
  $$('.card').forEach(a=>a.classList.toggle('is-chosen',a.dataset.id===st.chosen));
  $$('[data-pick]').forEach(b=>{const on=b.dataset.pick===st.chosen,short=!!b.closest('.cap');b.replaceChildren(document.createTextNode(on?(short?t('selected'):t('selectedCopy')):(short?t('select'):t('selectDirection'))));if(!short)b.append(el('kbd',null,'P'));b.toggleAttribute('data-on',on);b.title=on?t('recopyTitle'):t('selectTitle');});
  $$('#film button').forEach(b=>b.querySelector('.ft').classList.toggle('chosen',b.dataset.id===st.chosen));
 }
 function copyText(){const c=byId[st.chosen];let text=t('copyChoice',{round:DATA.round?t('copyRound',{round:DATA.round}):'',number:no(c),name:c.name});return text;}
 async function copy(t=copyText()){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true;}catch{const a=el('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{ok=document.execCommand('copy');}catch{}a.remove();}
  toast(ok,t);
 }
 function toast(ok,text){
  const n=$('#toast');n.toggleAttribute('data-fail',!ok);n.querySelector('b').textContent=ok?t('copied'):t('copyFailed');n.querySelector('code').textContent=ok?text.replace(/\n/g,' · '):text;
  n.classList.remove('show');n.offsetWidth;n.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),ok?2400:8000);
 }

 $$('button[data-layout]').forEach(b=>b.addEventListener('click',()=>setLayout(b.dataset.layout)));
 $$('button[data-viewport]').forEach(b=>b.addEventListener('click',()=>{if(st.viewport===b.dataset.viewport)return;st.viewport=b.dataset.viewport;save();morph(render,'reshape');}));
 $('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));
 document.addEventListener('keydown',e=>{
  if(e.target.closest?.('textarea,input,summary')||e.metaKey||e.ctrlKey||e.altKey||st.layout!=='loupe')return;
  if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key==='Escape')setLayout('compare');else if(e.key.toLowerCase()==='p')choose(st.current);
 });
 function syncBars(){root.style.setProperty('--bar-h',`${$('#bar').offsetHeight}px`);placeThumbs(true);placeFilm(true);refit();}
 window.addEventListener('resize',syncBars,{passive:true});
 document.fonts?.ready.then(()=>{placeThumbs(true);placeFilm(true);});
 $('#bar').hidden=false;
 if(st.layout==='compare'){$('#grid').classList.add('first');$('.intro').classList.add('first');setTimeout(()=>{$('#grid').classList.remove('first');$('.intro').classList.remove('first');},1400);}
 render();syncBars();
 if(services.size){checkServices();setInterval(()=>{if(!document.hidden)checkServices();},5000);window.addEventListener('focus',checkServices);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkServices();});}
})();
</script></body></html>
